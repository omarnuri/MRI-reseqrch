name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.12 is what Colab runs; 3.13 guards against the next runtime bump.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # The repository history contains a 35 MB DICOM archive; the tests need
          # none of it.
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        # Deliberately not the segmentation stack: the suite runs without GPU,
        # without model weights and without patient data, in seconds.
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy nibabel pydicom pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Check every stage is registered and degrades cleanly
        run: python -m spinelab stages
